name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Prepare locked Windows offline wheels
        if: runner.os == 'Windows'
        run: python -m pip download --only-binary=:all: --require-hashes -r requirements.lock -d "${{ runner.temp }}/workbench-wheels"
      - name: Exercise real offline installer and repeated install
        if: runner.os == 'Windows'
        run: |
          python scripts/setup_windows.py --wheelhouse "${{ runner.temp }}/workbench-wheels"
          python scripts/setup_windows.py --wheelhouse "${{ runner.temp }}/workbench-wheels"
          ./.venv/Scripts/python.exe -m pip check
      - name: Exercise CMD auto-selection and actual launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set WORKBENCH_PYTHON=
          call Setup.cmd --check < nul
          if errorlevel 1 exit /b 1
          call Launch.cmd --help
